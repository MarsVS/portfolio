<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | Pearlvets</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* Brand colors updated to #8f1eae */
        .text-brand-teal {
            color: #8f1eae; /* Deep purple accent */
        }
        
        .bg-brand-teal {
            background-color: #8f1eae;
        }
        
        .bg-brand-tealhover:hover {
            background-color: #791794; /* Darker purple for hover state */
        }

        .bg-brand-mint {
            background-color: #fbf2fc; /* Light purple for card accents */
        }

        .border-brand-teal {
            border-color: #8f1eae;
        }

        .custom-card {
            background: #ffffff;
            border-radius: 1.25rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
            outline: none;
            transition: all 0.2s ease;
        }
        .input-field:focus {
            border-color: #8f1eae;
            box-shadow: 0 0 0 3px rgba(143, 30, 174, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Light Navigation Header -->
    <nav class="bg-white sticky top-0 z-40 shadow-sm border-b border-slate-100 relative">
        <div class="max-w-[90rem] mx-auto px-4 sm:px-6 py-2 flex justify-between items-center gap-4">
            
            <!-- Logo (Fixed height 72px) -->
            <a href="index.html" class="flex items-center shrink-0"> 
                <img src="images/logo.png" alt="Pearlvets Logo" class="h-[72px] w-auto object-contain"> 
            </a>

            <!-- Header Action Items: User Avatar & Universal Hamburger Button -->
            <div class="flex items-center space-x-2.5 sm:space-x-3 shrink-0">
                <!-- User Profile Avatar -->
                <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center cursor-pointer hover:bg-slate-200 transition shrink-0" title="My Account">
                    <i class="fa-solid fa-user text-base"></i>
                </div>

                <!-- Hamburger Menu Button (Visible across ALL screen sizes) -->
                <button id="mobile-menu-btn" aria-label="Toggle Navigation Menu" class="p-2.5 rounded-xl text-slate-700 bg-slate-100 hover:bg-slate-200 hover:text-brand-teal focus:outline-none transition flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-bars text-xl sm:text-2xl"></i>
                </button>
            </div>
        </div>

        <!-- Universal Collapsible Centered & Scrollable Menu Dropdown -->
        <div id="mobile-menu" class="hidden bg-white border-t border-slate-100 px-4 sm:px-8 py-6 absolute top-full left-0 w-full shadow-2xl z-50 max-h-[calc(100vh-90px)] overflow-y-auto">
            <div class="max-w-3xl mx-auto space-y-6 text-center flex flex-col items-center pb-12">
                
                <!-- 24/7 Hotline Call CTA inside menu dropdown -->
                <div class="pb-4 border-b border-slate-100 w-full flex flex-col items-center justify-center gap-2 text-center">
                    <a href="virtconsul.html" class="bg-rose-600 hover:bg-rose-700 text-white px-6 py-3 rounded-xl transition font-semibold text-sm shadow-sm flex items-center justify-center space-x-2 w-full sm:w-auto">
                        <i class="fa-solid fa-phone-volume"></i>
                        <span>24/7 Hotline Consultation</span>
                    </a>
                    <span class="text-xs text-slate-400">Pearlvets Quick Navigation</span>
                </div>

                <!-- Navigation Links Grid (Centered Content) -->
                <div class="w-full grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 text-slate-600 text-sm font-medium text-center">
                    <a href="index.html" class="hover:text-brand-teal transition p-3 rounded-xl hover:bg-slate-50 block text-center">Home</a>
                    <a href="about.html" class="hover:text-brand-teal transition p-3 rounded-xl hover:bg-slate-50 block text-center">About</a>
                    <a href="services.html" class="hover:text-brand-teal transition p-3 rounded-xl hover:bg-slate-50 block text-center">Services</a>
                    <a href="virthosp.html" class="hover:text-brand-teal transition p-3 rounded-xl hover:bg-slate-50 block text-center">Virtual Hospital</a>
                    <a href="medrpov.html" class="hover:text-brand-teal transition p-3 rounded-xl hover:bg-slate-50 block text-center">Medical Records</a>
                    <a href="virtconsul.html" class="hover:text-brand-teal transition p-3 rounded-xl hover:bg-slate-50 block text-center">Virtual Consultations</a>
                    
                    <!-- Highlighted active page link for Book Appointments -->
                    <a href="bookpov.html" class="text-brand-teal font-semibold transition p-3 rounded-xl bg-brand-mint flex items-center justify-center space-x-2 text-center">
                        <span class="w-2 h-2 rounded-full bg-brand-teal"></span>
                        <span>Book Appointments</span>
                    </a>

                    <a href="petpov.html" class="hover:text-brand-teal transition p-3 rounded-xl hover:bg-slate-50 block text-center">Pet Profile</a>
                    <a href="prepov.html" class="hover:text-brand-teal transition p-3 rounded-xl hover:bg-slate-50 block text-center">Prescriptions</a>
                    <a href="lapov.html" class="hover:text-brand-teal transition p-3 rounded-xl hover:bg-slate-50 block text-center">Lab Results</a>
                    <a href="vapov.html" class="hover:text-brand-teal transition p-3 rounded-xl hover:bg-slate-50 block text-center">Vaccinations</a>
                    <a href="repov.html" class="hover:text-brand-teal transition p-3 rounded-xl hover:bg-slate-50 block text-center">Reminders</a>
                    <a href="empov.html" class="text-rose-600 hover:text-rose-700 transition p-3 rounded-xl hover:bg-rose-50 flex items-center justify-center space-x-2 font-semibold text-center">
                        <i class="fa-solid fa-triangle-exclamation text-xs"></i>
                        <span>Emergency Help</span>
                    </a>
                    <a href="bipov.html" class="hover:text-brand-teal transition p-3 rounded-xl hover:bg-slate-50 block text-center">Payments</a>
                    <a href="contact.html" class="hover:text-brand-teal transition p-3 rounded-xl hover:bg-slate-50 block text-center">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="flex-grow p-6">
        <div class="max-w-2xl mx-auto">
            
            <!-- Page Header -->
            <div class="mb-8 mt-4 flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl bg-brand-mint flex items-center justify-center shrink-0">
                    <i class="fa-regular fa-calendar-check text-brand-teal text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">Book Appointment</h1>
                    <p class="text-slate-500 text-sm">Schedule a visit for your furry friend</p>
                </div>
            </div>

            <!-- Booking Form Card -->
            <div class="custom-card p-6 md:p-8">
                <form action="#" method="POST" class="space-y-6">
                    
                    <!-- Pet Selection -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Select Pet</label>
                        <div class="grid grid-cols-2 gap-4">
                            <label class="cursor-pointer">
                                <input type="radio" name="pet" class="peer sr-only" checked>
                                <div class="p-4 rounded-xl border border-slate-200 peer-checked:border-[#8f1eae] peer-checked:bg-brand-mint hover:bg-slate-50 transition flex items-center space-x-3">
                                    <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm text-brand-teal">
                                        <i class="fa-solid fa-dog"></i>
                                    </div>
                                    <div class="font-medium text-slate-800 peer-checked:text-[#8f1eae]">Buddy (Dog)</div>
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="pet" class="peer sr-only">
                                <div class="p-4 rounded-xl border border-slate-200 peer-checked:border-[#8f1eae] peer-checked:bg-brand-mint hover:bg-slate-50 transition flex items-center space-x-3">
                                    <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm text-brand-teal">
                                        <i class="fa-solid fa-cat"></i>
                                    </div>
                                    <div class="font-medium text-slate-800 peer-checked:text-[#8f1eae]">Luna (Cat)</div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Appointment Type -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Reason for Visit</label>
                        <select class="input-field bg-white text-slate-700" required>
                            <option value="" disabled selected>Select a service...</option>
                            <option value="checkup">General Checkup</option>
                            <option value="vaccination">Vaccinations</option>
                            <option value="sick">Sick Visit / Unwell</option>
                            <option value="dental">Dental Care</option>
                        </select>
                    </div>

                    <!-- Date & Time Selection -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Date</label>
                            <input type="date" class="input-field bg-white text-slate-700" required>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Time Preference</label>
                            <select class="input-field bg-white text-slate-700" required>
                                <option value="" disabled selected>Select time slot...</option>
                                <option value="morning">Morning (9:00 AM - 12:00 PM)</option>
                                <option value="afternoon">Afternoon (1:00 PM - 4:00 PM)</option>
                                <option value="evening">Evening (4:00 PM - 7:00 PM)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Additional Notes -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Additional Notes (Optional)</label>
                        <textarea class="input-field bg-white text-slate-700 h-24 resize-none" placeholder="Describe any symptoms or specific concerns..."></textarea>
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-4 border-t border-slate-100">
                        <button type="submit" class="w-full bg-brand-teal bg-brand-tealhover text-white font-semibold py-3.5 px-6 rounded-xl transition duration-200 shadow-md flex items-center justify-center space-x-2">
                            <span>Confirm Appointment</span>
                            <i class="fa-solid fa-arrow-right text-sm"></i>
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <!-- Mobile Menu Toggle Script -->
    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        const icon = btn.querySelector('i');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
            if (menu.classList.contains('hidden')) {
                icon.classList.remove('fa-xmark');
                icon.classList.add('fa-bars');
            } else {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-xmark');
            }
        });
    </script>
</body>
</html>
