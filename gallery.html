<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery - Dr. Christopher Ngumu | VetCare</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            teal: '#087d72',
                            tealHover: '#06635a',
                            navy: '#0b1727',
                            lightBg: '#f8fafc'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-brand-lightBg font-sans text-slate-800 antialiased selection:bg-brand-teal selection:text-white min-h-screen flex flex-col justify-between">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between items-center h-16">
                
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-brand-teal flex items-center justify-center text-white shadow-sm">
                        <i class="fa-solid fa-camera text-lg"></i>
                    </div>
                    <span class="font-bold text-slate-900 text-base sm:text-lg tracking-tight">Dr. Christopher Ngumu</span>
                </div>

                <div class="hidden md:flex items-center space-x-8 text-sm font-semibold text-slate-600">
                    <a href="index.html" class="hover:text-brand-teal transition">Home</a>
                    <a href="about.html" class="hover:text-brand-teal transition">About</a>
                    <a href="services.html" class="hover:text-brand-teal transition">Services</a>
                    <a href="gallery.html" class="text-brand-teal transition font-bold">Gallery</a>
                    <a href="contact.html" class="hover:text-brand-teal transition">Contact</a>
                </div>

                <div class="hidden md:flex items-center">
                    <a href="virtconsul.html" class="bg-brand-teal hover:bg-brand-tealHover text-white text-xs font-semibold px-4 py-2 rounded-xl transition shadow-xs">
                        Book a Consultation
                    </a>
                </div>

                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="text-slate-700 hover:text-brand-teal focus:outline-none p-2">
                        <i class="fa-solid fa-bars text-xl" id="menu-icon"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-slate-200 px-4 pt-2 pb-5 space-y-3 font-medium text-sm">
            <a href="index.html" class="block text-slate-700 hover:text-brand-teal py-1.5">Home</a>
            <a href="about.html" class="block text-slate-700 hover:text-brand-teal py-1.5">About</a>
            <a href="services.html" class="block text-slate-700 hover:text-brand-teal py-1.5">Services</a>
            <a href="gallery.html" class="block text-brand-teal font-semibold py-1.5">Gallery</a>
            <a href="contact.html" class="block text-slate-700 hover:text-brand-teal py-1.5">Contact</a>
            <div class="pt-2">
                <a href="virtconsul.html" class="block text-center bg-brand-teal hover:bg-brand-tealHover text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition shadow-xs">
                    Book a Consultation
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 sm:py-12 flex-1 flex flex-col justify-start items-center space-y-8 w-full">
        
        <div class="flex items-center gap-3 overflow-x-auto hide-scrollbar w-full justify-start sm:justify-center pb-1">
            <button class="px-6 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-brand-teal text-white shadow-xs whitespace-nowrap">
                Clinic Life
            </button>
            <button class="px-6 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 transition whitespace-nowrap">
                Surgery
            </button>
            <button class="px-6 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 transition whitespace-nowrap">
                Patients
            </button>
            <button class="px-6 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 transition whitespace-nowrap">
                Events
            </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 w-full">
            
            <div class="aspect-[4/3] rounded-2xl bg-slate-200 overflow-hidden shadow-xs hover:shadow-md transition duration-300 group">
                <img src="https://images.unsplash.com/photo-1548767797-d8c844163c4c?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" 
                     alt="Veterinarian performing procedure" 
                     class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
            </div>

            <div class="aspect-[4/3] rounded-2xl bg-slate-200 overflow-hidden shadow-xs hover:shadow-md transition duration-300 group">
                <img src="https://images.unsplash.com/photo-1576201836106-db1758fd1c97?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" 
                     alt="Surgeon working under sterile lights" 
                     class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
            </div>

            <div class="aspect-[4/3] rounded-2xl bg-slate-200 overflow-hidden shadow-xs hover:shadow-md transition duration-300 group">
                <img src="https://images.unsplash.com/photo-1628009368231-7bb7cfcb0def?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" 
                     alt="Vet interacting with dog" 
                     class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
            </div>

            <div class="aspect-[4/3] rounded-2xl bg-slate-200 overflow-hidden shadow-xs hover:shadow-md transition duration-300 group">
                <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" 
                     alt="Happy Golden Retriever patient" 
                     class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
            </div>

            <div class="aspect-[4/3] rounded-2xl bg-slate-200 overflow-hidden shadow-xs hover:shadow-md transition duration-300 group">
                <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" 
                     alt="Cat examination at clinical desk" 
                     class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
            </div>

            <div class="aspect-[4/3] rounded-2xl bg-slate-200 overflow-hidden shadow-xs hover:shadow-md transition duration-300 group">
                <img src="https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" 
                     alt="Veterinary team collaboration" 
                     class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
            </div>

        </div>

        <div class="pt-2">
            <button class="bg-brand-teal hover:bg-brand-tealHover text-white text-xs sm:text-sm font-semibold px-8 py-3 rounded-xl shadow-xs transition transform hover:-translate-y-0.5">
                View More Photos
            </button>
        </div>

    </main>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 font-medium">
        <p>© 2026 Dr. Christopher Ngumu. All rights reserved.</p>
    </footer>

    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        const icon = document.getElementById('menu-icon');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
            if (!menu.classList.contains('hidden')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-xmark');
            } else {
                icon.classList.remove('fa-xmark');
                icon.classList.add('fa-bars');
            }
        });
    </script>
</body>
</html>
